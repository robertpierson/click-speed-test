<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{height:100%;margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;transition:background .1s}
  body{background:#222;color:#fff;flex-direction:column;gap:1rem;cursor:pointer;user-select:none}
  h1{font-size:2rem;margin:0;transition:transform .1s}
  p{font-size:1.2rem;opacity:.8}
</style>
</head>
<body>
<h1 id="msg">Click or press Space to start</h1>
<p id="best"></p>
<script>
  const body = document.body, msg = document.getElementById('msg'), best = document.getElementById('best');
  let state = 'idle', start = 0, timer = null;
  
  // Safely parse the stored string into a rigid base-10 integer
  const storedBest = localStorage.getItem('bestMs');
  let bestMs = storedBest ? parseInt(storedBest, 10) : null;
  
  if (bestMs) best.textContent = 'Best: ' + bestMs + ' ms';

  function handleAction(e) {
    if (e.type === 'keydown' && e.code !== 'Space') return;

    if (state === 'idle') {
      state = 'waiting';
      body.style.background = '#a33';
      msg.style.transform = 'scale(1)';
      msg.textContent = 'Wait for green...';
      const delay = 1000 + Math.random() * 3000;
      timer = setTimeout(() => {
        state = 'go';
        body.style.background = '#2a2';
        msg.style.transform = 'scale(1.5)';
        msg.textContent = 'CLICK!';
        start = performance.now();
      }, delay);
    } else if (state === 'waiting') {
      clearTimeout(timer);
      state = 'idle';
      body.style.background = '#222';
      msg.style.transform = 'scale(1)';
      msg.textContent = 'Too soon! Click/Space to retry';
    } else if (state === 'go') {
      const ms = Math.round(performance.now() - start);
      state = 'idle';
      body.style.background = '#222';
      msg.style.transform = 'scale(1)';
      msg.textContent = ms + ' ms — click/Space to try again';
      
      // Since bestMs is now strictly an integer (or null), this comparison is rock solid
      if (bestMs === null || ms < bestMs) {
        bestMs = ms;
        localStorage.setItem('bestMs', ms.toString()); // Explicitly store as a string
        best.textContent = 'Best: ' + ms + ' ms';
      }
    }
  }

  body.addEventListener('pointerdown', handleAction);
  document.addEventListener('keydown', handleAction);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex Test — Ultimate Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-idle: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
    --bg-waiting: radial-gradient(circle at 50% 0%, #b91c1c 0%, #7f1d1d 100%);
    --bg-go: radial-gradient(circle at 50% 0%, #16a34a 0%, #14532d 100%);
    --bg-early: radial-gradient(circle at 50% 0%, #ea580c 0%, #7c2d12 100%);
    
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.15);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; 
    overflow: hidden;
  }

  /* Accessibility: Outline for keyboard focus */
  body:focus-visible {
    outline: 4px solid rgba(255, 255, 255, 0.5);
    outline-offset: -4px;
  }

  body {
    background: var(--bg-idle);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .container {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    max-width: 90%;
    width: 480px;
    pointer-events: none; 
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Animations */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  .state-waiting { animation: pulse 1.5s infinite ease-in-out; }
  .state-early { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  .state-pop { transform: scale(1.05); }

  .icon {
    font-size: 4rem;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    line-height: 1;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  p.subtitle {
    font-size: 1.1rem;
    margin: 0;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 400;
  }

  .rank-badge {
    display: inline-block;
    margin-top: 1.2rem;
    padding: 0.5rem 1.2rem;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  
  .rank-badge.show {
    opacity: 1;
    transform: translateY(0);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0, 0, 0, 0.2);
    padding: 1rem 0.5rem;
    border-radius: 16px;
  }

  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 0.3rem;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .reset-btn {
    margin-top: 2rem;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    pointer-events: auto; 
    transition: color 0.2s ease;
    font-family: inherit;
    padding: 0.5rem;
    border-radius: 4px;
  }

  .reset-btn:hover, .reset-btn:focus-visible {
    color: rgba(255, 255, 255, 0.8);
    outline: 2px solid rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body role="button" tabindex="0" aria-label="Interactive Reflex Test">

<div class="container" id="card">
  <div class="icon" id="icon">⚡</div>
  <h1 id="msg" aria-live="polite">Click or Press Space</h1>
  <p class="subtitle" id="sub">Test your speed & reaction time</p>
  <div class="rank-badge" id="rank"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="best-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Last</span>
      <span class="stat-value" id="last-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Average</span>
      <span class="stat-value" id="avg-val">--</span>
    </div>
  </div>
  
  <button class="reset-btn" id="reset-btn" aria-label="Reset Statistics">Reset Stats</button>
</div>

<script>
class ReflexGame {
  constructor() {
    // Centralized configuration
    this.CONFIG = {
      delays: { min: 1500, max: 3000 },
      ranks: [
        { limit: 170, title: '⚡ Esports God' },
        { limit: 210, title: '🎮 Pro Gamer' },
        { limit: 260, title: '🔥 Fast Reflexes' },
        { limit: 320, title: '🐢 Human Average' },
        { limit: Infinity, title: '💤 Sloth Speed' }
      ],
      sounds: {
        go: { freq: 880, type: 'sine', duration: 0.15, vol: 0.2 },
        early: { freq: 150, type: 'sawtooth', duration: 0.3, vol: 0.1 },
        success: { freq: 587.33, type: 'triangle', duration: 0.4, vol: 0.15 }
      }
    };

    // State Variables
    this.state = 'idle'; // 'idle', 'waiting', 'go'
    this.timer = null;
    this.startMs = 0;
    this.scores = [];
    this.bestMs = null;
    this.audioCtx = null;

    // DOM Elements
    this.ui = {
      body: document.body,
      card: document.getElementById('card'),
      msg: document.getElementById('msg'),
      sub: document.getElementById('sub'),
      icon: document.getElementById('icon'),
      rank: document.getElementById('rank'),
      bestVal: document.getElementById('best-val'),
      lastVal: document.getElementById('last-val'),
      avgVal: document.getElementById('avg-val'),
      resetBtn: document.getElementById('reset-btn')
    };

    this.init();
  }

  init() {
    this.loadStats();
    this.bindEvents();
  }

  bindEvents() {
    // Use an arrow function to preserve 'this' context
    const actionHandler = (e) => this.handleAction(e);
    
    this.ui.body.addEventListener('pointerdown', actionHandler);
    document.addEventListener('keydown', actionHandler);
    
    this.ui.resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      this.resetStats();
    });
  }

  initAudio() {
    if (!this.audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.audioCtx = new AudioContext();
    }
    if (this.audioCtx && this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
  }

  playSound(config) {
    if (!this.audioCtx) return;
    try {
      const { freq, type, duration, vol } = config;
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
      
      // Smooth envelope for clean audio
      gain.gain.setValueAtTime(0, this.audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, this.audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + duration);
    } catch (e) {
      console.warn("Audio playback failed", e);
    }
  }

  // Local Storage with Error Handling (Failsafe for Incognito/Restricted modes)
  loadStats() {
    try {
      const storedBest = localStorage.getItem('reflexBest');
      const storedScores = localStorage.getItem('reflexScores');
      
      this.bestMs = storedBest ? parseInt(storedBest, 10) : null;
      this.scores = storedScores ? JSON.parse(storedScores) : [];
      
      this.ui.bestVal.textContent = this.bestMs ? `${this.bestMs} ms` : '--';
      this.updateAverage();
    } catch (e) {
      console.warn('LocalStorage is not available.');
    }
  }

  saveStats() {
    try {
      localStorage.setItem('reflexBest', this.bestMs.toString());
      localStorage.setItem('reflexScores', JSON.stringify(this.scores));
    } catch (e) {
      // Fail silently if storage is restricted
    }
  }

  resetStats() {
    try {
      localStorage.removeItem('reflexBest');
      localStorage.removeItem('reflexScores');
    } catch (e) {}
    
    this.scores = [];
    this.bestMs = null;
    this.ui.lastVal.textContent = '--';
    this.ui.bestVal.textContent = '--';
    this.ui.avgVal.textContent = '--';
    
    this.ui.resetBtn.textContent = 'Cleared!';
    setTimeout(() => this.ui.resetBtn.textContent = 'Reset Stats', 1000);
  }

  updateAverage() {
    if (this.scores.length === 0) {
      this.ui.avgVal.textContent = '--';
      return;
    }
    const sum = this.scores.reduce((a, b) => a + b, 0);
    const avg = Math.round(sum / this.scores.length);
    this.ui.avgVal.textContent = `${avg} ms`;
  }

  getRank(ms) {
    return this.CONFIG.ranks.find(r => ms < r.limit).title;
  }

  resetUIState() {
    this.ui.card.className = 'container';
    this.ui.rank.classList.remove('show');
  }

  updateUI(bgVar, iconText, msgText, subText, animationClass = null) {
    this.resetUIState();
    if (animationClass) this.ui.card.classList.add(animationClass);
    
    this.ui.body.style.background = `var(${bgVar})`;
    this.ui.icon.textContent = iconText;
    this.ui.msg.textContent = msgText;
    this.ui.sub.textContent = subText;
  }

  handleAction(e) {
    if (e.target === this.ui.resetBtn) return;
    
    if (e.type === 'keydown') {
      if (e.code !== 'Space') return;
      e.preventDefault();
      if (e.repeat) return; // Prevent holding down spacebar
    }

    this.initAudio();

    switch (this.state) {
      case 'idle':
        this.startWaiting();
        break;
      case 'waiting':
        this.triggerEarly();
        break;
      case 'go':
        this.registerClick();
        break;
    }
  }

  startWaiting() {
    this.state = 'waiting';
    this.updateUI('--bg-waiting', '✋', 'Wait for green...', 'Keep your finger ready', 'state-waiting');

    const delay = this.CONFIG.delays.min + Math.random() * (this.CONFIG.delays.max - this.CONFIG.delays.min);
    
    this.timer = setTimeout(() => {
      this.state = 'go';
      this.updateUI('--bg-go', '⚡', 'CLICK NOW!', 'Fast!');
      this.ui.card.classList.remove('state-waiting');
      this.startMs = performance.now();
      this.playSound(this.CONFIG.sounds.go);
    }, delay);
  }

  triggerEarly() {
    clearTimeout(this.timer);
    this.state = 'idle';
    this.updateUI('--bg-early', '⚠️', 'Too soon!', 'Click or press Space to try again', 'state-early');
    this.playSound(this.CONFIG.sounds.early);
  }

  registerClick() {
    const endMs = performance.now();
    const reactionTime = Math.round(endMs - this.startMs);
    
    this.state = 'idle';
    this.updateUI('--bg-idle', '⚡', `${reactionTime} ms`, 'Click or press Space to retry', 'state-pop');
    setTimeout(() => this.ui.card.classList.remove('state-pop'), 200);
    
    this.playSound(this.CONFIG.sounds.success);

    // Update Stats
    this.ui.lastVal.textContent = `${reactionTime} ms`;
    this.scores.push(reactionTime);
    
    if (this.bestMs === null || reactionTime < this.bestMs) {
      this.bestMs = reactionTime;
      this.ui.bestVal.textContent = `${reactionTime} ms`;
    }

    this.updateAverage();
    this.saveStats();

    // Show Rank
    this.ui.rank.textContent = this.getRank(reactionTime);
    this.ui.rank.classList.add('show');
  }
}

// Boot the game when the DOM is ready
document.addEventListener('DOMContentLoaded', () => {
  new ReflexGame();
});
</script>
</body>
</html>

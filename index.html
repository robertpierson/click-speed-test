<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex Test — Ultimate Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-idle: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
    --bg-waiting: radial-gradient(circle at 50% 0%, #b91c1c 0%, #7f1d1d 100%);
    --bg-go: radial-gradient(circle at 50% 0%, #16a34a 0%, #14532d 100%);
    --bg-early: radial-gradient(circle at 50% 0%, #ea580c 0%, #7c2d12 100%);
    
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --gold: #fbbf24;
  }

  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; 
    overflow: hidden;
  }

  /* Animated Grid Background */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
    pointer-events: none;
  }

  body {
    background: var(--bg-idle);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3.5rem 2.5rem;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 32px;
    box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
    max-width: 90%;
    width: 500px;
    pointer-events: none; 
  }

  .icon {
    font-size: 4.5rem;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    line-height: 1;
  }

  h1 {
    font-size: 2.75rem;
    font-weight: 800;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.04em;
    line-height: 1.1;
  }

  p.subtitle {
    font-size: 1.15rem;
    margin: 0;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 400;
  }

  .rank-badge {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.6rem 1.4rem;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(15px);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .rank-badge.show {
    opacity: 1;
    transform: translateY(0);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
    padding: 1.25rem 0.5rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    transition: background 0.3s ease;
  }

  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 0.4rem;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .reset-btn {
    margin-top: 2.5rem;
    background: transparent;
    border: 1px solid transparent;
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    pointer-events: auto; 
    transition: all 0.2s ease;
    font-family: inherit;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
  }

  .reset-btn:hover, .reset-btn:focus-visible {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    outline: none;
  }
</style>
</head>
<body>

<main id="card" aria-live="polite">
  <div class="icon" id="icon" aria-hidden="true">⚡</div>
  <h1 id="msg">Click or Press Space</h1>
  <p class="subtitle" id="sub">Test your speed & reaction time</p>
  <div class="rank-badge" id="rank" aria-hidden="true"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="best-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Last</span>
      <span class="stat-value" id="last-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Average</span>
      <span class="stat-value" id="avg-val">--</span>
    </div>
  </div>
  
  <button class="reset-btn" id="reset-btn" aria-label="Reset Statistics">Reset Stats</button>
</main>

<script>
class ReflexGame {
  constructor() {
    this.CONFIG = {
      delays: { min: 1500, max: 4000 },
      cheatThreshold: 40, // Impossible human reaction time (ms)
      maxScoresToAverage: 50,
      ranks: [
        { limit: 180, title: '⚡ Esports God', color: '#fbbf24' },  
        { limit: 220, title: '🎮 Pro Gamer', color: '#a78bfa' },    
        { limit: 270, title: '🔥 Fast Reflexes', color: '#34d399' }, 
        { limit: 330, title: '🐢 Human Average', color: '#94a3b8' }, 
        { limit: Infinity, title: '💤 Sloth Speed', color: '#f87171' } 
      ],
      sounds: {
        go: { freq: 880, type: 'sine', duration: 0.15, vol: 0.2 },
        early: { freq: 150, type: 'sawtooth', duration: 0.3, vol: 0.1 },
        success: { freq: 587.33, type: 'triangle', duration: 0.4, vol: 0.15 },
        highscore: { freq: 1046.5, type: 'sine', duration: 0.5, vol: 0.2 }
      }
    };

    this.state = 'idle'; 
    this.timer = null;
    this.startMs = 0;
    this.scores = [];
    this.bestMs = null;
    this.audioCtx = null;
    this.waitingAnimation = null;

    this.ui = {
      body: document.body,
      card: document.getElementById('card'),
      msg: document.getElementById('msg'),
      sub: document.getElementById('sub'),
      icon: document.getElementById('icon'),
      rank: document.getElementById('rank'),
      bestVal: document.getElementById('best-val'),
      lastVal: document.getElementById('last-val'),
      avgVal: document.getElementById('avg-val'),
      resetBtn: document.getElementById('reset-btn')
    };

    this.init();
  }

  init() {
    this.loadStats();
    this.bindEvents();
  }

  bindEvents() {
    const actionHandler = (e) => {
      if (e.target === this.ui.resetBtn) return;
      if (e.type === 'keydown' && (e.code !== 'Space' || e.repeat)) return;
      
      e.preventDefault();
      this.handleAction();
    };
    
    window.addEventListener('pointerdown', actionHandler);
    window.addEventListener('keydown', actionHandler);
    
    this.ui.resetBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      this.resetStats();
    });
  }

  initAudio() {
    if (!this.audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.audioCtx = new AudioContext();
    }
    if (this.audioCtx?.state === 'suspended') this.audioCtx.resume();
  }

  playSound({ freq, type, duration, vol }) {
    if (!this.audioCtx) return;
    try {
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0, this.audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, this.audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + duration);
    } catch (e) {
      console.warn("Audio playback failed", e);
    }
  }

  /* --- Storage Methods --- */

  loadStats() {
    try {
      this.bestMs = parseInt(localStorage.getItem('reflexBest')) || null;
      this.scores = JSON.parse(localStorage.getItem('reflexScores')) || [];
      
      this.ui.bestVal.textContent = this.bestMs ? `${this.bestMs} ms` : '--';
      if (this.bestMs) this.ui.bestVal.style.color = 'var(--gold)';
      this.updateAverage();
    } catch (e) {
      console.warn('LocalStorage is not available.');
    }
  }

  saveStats() {
    try {
      localStorage.setItem('reflexBest', this.bestMs.toString());
      localStorage.setItem('reflexScores', JSON.stringify(this.scores));
    } catch (e) {}
  }

  resetStats() {
    localStorage.removeItem('reflexBest');
    localStorage.removeItem('reflexScores');
    
    this.scores = [];
    this.bestMs = null;
    this.ui.lastVal.textContent = '--';
    this.ui.bestVal.textContent = '--';
    this.ui.bestVal.style.color = '';
    this.ui.avgVal.textContent = '--';
    this.ui.rank.classList.remove('show');
    
    this.ui.resetBtn.textContent = 'Cleared!';
    setTimeout(() => this.ui.resetBtn.textContent = 'Reset Stats', 1000);
  }

  /* --- UI & Animation Methods (Using WAAPI) --- */

  updateAverage() {
    if (!this.scores.length) return;
    const sum = this.scores.reduce((a, b) => a + b, 0);
    this.ui.avgVal.textContent = `${Math.round(sum / this.scores.length)} ms`;
  }

  updateUI(bgVar, iconText, msgText, subText) {
    this.ui.body.style.background = `var(${bgVar})`;
    this.ui.icon.textContent = iconText;
    this.ui.msg.textContent = msgText;
    this.ui.sub.textContent = subText;
  }

  animateShake() {
    this.ui.card.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-10px)', offset: 0.2 },
      { transform: 'translateX(10px)', offset: 0.4 },
      { transform: 'translateX(-10px)', offset: 0.6 },
      { transform: 'translateX(10px)', offset: 0.8 },
      { transform: 'translateX(0)' }
    ], { duration: 400, easing: 'cubic-bezier(.36,.07,.19,.97)' });
  }

  animatePop(element, isGold = false) {
    element.animate([
      { transform: 'scale(1)', color: isGold ? '#fff' : 'inherit' },
      { transform: 'scale(1.2)', color: isGold ? 'var(--gold)' : 'inherit', offset: 0.5 },
      { transform: 'scale(1)', color: isGold ? 'var(--gold)' : 'inherit' }
    ], { duration: 500, easing: 'ease-out', fill: 'forwards' });
  }

  /* --- Game Logic --- */

  handleAction() {
    this.initAudio();

    switch (this.state) {
      case 'idle':
        this.startWaiting();
        break;
      case 'waiting':
        this.triggerEarly();
        break;
      case 'go':
        this.registerClick();
        break;
    }
  }

  startWaiting() {
    this.state = 'waiting';
    this.ui.rank.classList.remove('show');
    this.updateUI('--bg-waiting', '✋', 'Wait for green...', 'Keep your finger ready');

    // Continuous pulse animation via JS
    this.waitingAnimation = this.ui.card.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.02)' },
      { transform: 'scale(1)' }
    ], { duration: 1500, iterations: Infinity, easing: 'ease-in-out' });

    const delay = this.CONFIG.delays.min + Math.random() * (this.CONFIG.delays.max - this.CONFIG.delays.min);
    
    this.timer = setTimeout(() => {
      this.state = 'go';
      if (this.waitingAnimation) this.waitingAnimation.cancel();
      this.updateUI('--bg-go', '⚡', 'CLICK NOW!', 'Fast!');
      this.startMs = performance.now();
      this.playSound(this.CONFIG.sounds.go);
    }, delay);
  }

  triggerEarly() {
    clearTimeout(this.timer);
    if (this.waitingAnimation) this.waitingAnimation.cancel();
    
    this.state = 'idle';
    this.updateUI('--bg-early', '⚠️', 'Too soon!', 'Click or press Space to try again');
    this.animateShake();
    this.playSound(this.CONFIG.sounds.early);
  }

  registerClick() {
    const reactionTime = Math.round(performance.now() - this.startMs);
    this.state = 'idle';

    // Anti-cheat / false start check
    if (reactionTime < this.CONFIG.cheatThreshold) {
      this.updateUI('--bg-early', '🤖', 'Too Fast!', 'Looks like a guess. Try again.');
      this.animateShake();
      this.playSound(this.CONFIG.sounds.early);
      return;
    }

    this.updateUI('--bg-idle', '⏱️', `${reactionTime} ms`, 'Click or press Space to retry');
    this.animatePop(this.ui.card);
    
    if (this.scores.length >= this.CONFIG.maxScoresToAverage) this.scores.shift();
    this.scores.push(reactionTime);
    this.ui.lastVal.textContent = `${reactionTime} ms`;
    
    let isNewBest = false;
    if (!this.bestMs || reactionTime < this.bestMs) {
      this.bestMs = reactionTime;
      this.ui.bestVal.textContent = `${reactionTime} ms`;
      this.animatePop(this.ui.bestVal, true);
      isNewBest = true;
    }

    this.playSound(isNewBest ? this.CONFIG.sounds.highscore : this.CONFIG.sounds.success);
    this.updateAverage();
    this.saveStats();

    // Display Rank
    const rank = this.CONFIG.ranks.find(r => reactionTime < r.limit);
    this.ui.rank.textContent = rank.title;
    this.ui.rank.style.color = rank.color;
    this.ui.rank.style.borderColor = rank.color;
    this.ui.rank.classList.add('show');
  }
}

document.addEventListener('DOMContentLoaded', () => new ReflexGame());
</script>
</body>
</html>

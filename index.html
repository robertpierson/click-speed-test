<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex Test — Ultimate Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Rich gradients instead of flat colors */
    --bg-idle: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
    --bg-waiting: radial-gradient(circle at 50% 0%, #b91c1c 0%, #7f1d1d 100%);
    --bg-go: radial-gradient(circle at 50% 0%, #16a34a 0%, #14532d 100%);
    --bg-early: radial-gradient(circle at 50% 0%, #ea580c 0%, #7c2d12 100%);
    
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.15);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* Prevents mobile zoom/scroll issues */
    overflow: hidden;
  }

  body {
    background: var(--bg-idle);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .container {
    text-align: center;
    padding: 3rem 2rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    max-width: 90%;
    width: 480px;
    pointer-events: none; /* Lets clicks pass through to body */
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Animations */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  .state-waiting { animation: pulse 1.5s infinite ease-in-out; }
  .state-early { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  .state-pop { transform: scale(1.05); }

  .icon {
    font-size: 4rem;
    margin-bottom: 0.5rem;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    line-height: 1;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  p.subtitle {
    font-size: 1.1rem;
    margin: 0;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 400;
  }

  .rank-badge {
    display: inline-block;
    margin-top: 1.2rem;
    padding: 0.5rem 1.2rem;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  
  .rank-badge.show {
    opacity: 1;
    transform: translateY(0);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0, 0, 0, 0.2);
    padding: 1rem 0.5rem;
    border-radius: 16px;
  }

  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 0.3rem;
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* Reset Button */
  .reset-btn {
    margin-top: 2rem;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    pointer-events: auto; /* Re-enable clicks specifically for this */
    transition: color 0.2s ease;
    font-family: inherit;
    padding: 0.5rem;
  }

  .reset-btn:hover {
    color: rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body>

<div class="container" id="card">
  <div class="icon" id="icon">⚡</div>
  <h1 id="msg">Click or Press Space</h1>
  <p class="subtitle" id="sub">Test your speed & reaction time</p>
  <div class="rank-badge" id="rank"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="best-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Last</span>
      <span class="stat-value" id="last-val">--</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Average</span>
      <span class="stat-value" id="avg-val">--</span>
    </div>
  </div>
  
  <button class="reset-btn" id="reset-btn">Reset Stats</button>
</div>

<script>
  const body = document.body;
  const card = document.getElementById('card');
  const msg = document.getElementById('msg');
  const sub = document.getElementById('sub');
  const icon = document.getElementById('icon');
  const rank = document.getElementById('rank');
  const bestVal = document.getElementById('best-val');
  const lastVal = document.getElementById('last-val');
  const avgVal = document.getElementById('avg-val');
  const resetBtn = document.getElementById('reset-btn');

  let state = 'idle';
  let start = 0;
  let timer = null;
  let scores = [];
  let bestMs = null;

  // Web Audio API - Pre-warmed for zero latency
  let audioCtx = null;
  
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(freq, type, duration, vol = 0.15) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      // Smooth envelope to prevent audio clicking/popping
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {
      console.warn("Audio playback failed", e);
    }
  }

  // Load Stats
  function loadStats() {
    const storedBest = localStorage.getItem('reflexBest');
    const storedScores = localStorage.getItem('reflexScores');
    
    if (storedBest) {
      bestMs = parseInt(storedBest, 10);
      bestVal.textContent = bestMs + ' ms';
    } else {
      bestMs = null;
      bestVal.textContent = '--';
    }

    if (storedScores) {
      scores = JSON.parse(storedScores);
      updateAverage();
    } else {
      scores = [];
      avgVal.textContent = '--';
    }
  }

  function saveStats() {
    localStorage.setItem('reflexBest', bestMs.toString());
    localStorage.setItem('reflexScores', JSON.stringify(scores));
  }

  function updateAverage() {
    if (scores.length === 0) return;
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    avgVal.textContent = avg + ' ms';
  }

  function getRank(ms) {
    if (ms < 170) return '⚡ Esports God';
    if (ms < 210) return '🎮 Pro Gamer';
    if (ms < 260) return '🔥 Fast Reflexes';
    if (ms < 320) return '🐢 Human Average';
    return '💤 Sloth Speed';
  }

  function resetState() {
    card.className = 'container'; // clear animations
    rank.classList.remove('show');
  }

  function handleAction(e) {
    // Ignore clicks on the reset button
    if (e.target === resetBtn) return;
    
    // Normalize input
    if (e.type === 'keydown') {
      if (e.code !== 'Space') return;
      e.preventDefault();
      // Prevent key repeat triggering multiple times
      if (e.repeat) return; 
    }

    initAudio();

    if (state === 'idle') {
      state = 'waiting';
      resetState();
      card.classList.add('state-waiting');
      body.style.background = 'var(--bg-waiting)';
      icon.textContent = '✋';
      msg.textContent = 'Wait for green...';
      sub.textContent = 'Keep your finger ready';

      const delay = 1500 + Math.random() * 3000;
      timer = setTimeout(() => {
        state = 'go';
        card.classList.remove('state-waiting');
        body.style.background = 'var(--bg-go)';
        icon.textContent = '⚡';
        msg.textContent = 'CLICK NOW!';
        sub.textContent = 'Fast!';
        start = performance.now();
        playSound(880, 'sine', 0.15, 0.2); 
      }, delay);

    } else if (state === 'waiting') {
      clearTimeout(timer);
      state = 'idle';
      resetState();
      card.classList.add('state-early');
      body.style.background = 'var(--bg-early)';
      icon.textContent = '⚠️';
      msg.textContent = 'Too soon!';
      sub.textContent = 'Click or press Space to try again';
      playSound(150, 'sawtooth', 0.3, 0.1); 

    } else if (state === 'go') {
      const end = performance.now();
      const ms = Math.round(end - start);
      
      state = 'idle';
      resetState();
      card.classList.add('state-pop');
      setTimeout(() => card.classList.remove('state-pop'), 200);
      
      body.style.background = 'var(--bg-idle)';
      playSound(587.33, 'triangle', 0.4, 0.15); 

      msg.textContent = ms + ' ms';
      sub.textContent = 'Click or press Space to retry';
      lastVal.textContent = ms + ' ms';

      scores.push(ms);
      
      if (bestMs === null || ms < bestMs) {
        bestMs = ms;
        bestVal.textContent = ms + ' ms';
      }

      updateAverage();
      saveStats();

      rank.textContent = getRank(ms);
      rank.classList.add('show');
    }
  }

  // Event Listeners
  body.addEventListener('pointerdown', handleAction);
  document.addEventListener('keydown', handleAction);
  
  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Stop it from triggering the main game
    localStorage.removeItem('reflexBest');
    localStorage.removeItem('reflexScores');
    lastVal.textContent = '--';
    loadStats();
    
    // Brief visual feedback on button
    resetBtn.textContent = 'Cleared!';
    setTimeout(() => resetBtn.textContent = 'Reset Stats', 1000);
  });

  // Initialize
  loadStats();
</script>
</body>
</html>
